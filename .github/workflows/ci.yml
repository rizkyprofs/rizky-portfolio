name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["helm/**", "docs/**", "**.md"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the job commit the new image tag back to Git
      id-token: write   # lets the job get AWS credentials through OIDC
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portfolio:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            portfolio:scan

      # Everything below runs only on pushes to main AND only after AWS is set up
      # (the AWS_ROLE_ARN repository variable exists). Until then the job just builds and scans.
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Bump image tag in Helm values (GitOps)
        if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          sed -i "s|^  repository:.*|  repository: ${REGISTRY}/${REPO}|" helm/portfolio/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${TAG}\"|" helm/portfolio/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/portfolio/values.yaml
          git commit -m "chore: deploy ${TAG} [skip ci]" || exit 0
          git push
